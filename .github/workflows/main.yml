name: Revert Last Commit(s)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check latest commit
        id: check
        run: |
          WORKFLOW=".github/workflows/commit-revert.yml"

          if git diff-tree --no-commit-id --name-only -r HEAD | grep -Fxq "$WORKFLOW"; then
            echo "affects_workflow=true" >> "$GITHUB_OUTPUT"
          else
            echo "affects_workflow=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Revert latest commit
        if: steps.check.outputs.affects_workflow == 'false'
        run: |
          git revert HEAD --no-edit
          git push origin HEAD:main

      - name: Revert latest two commits
        if: steps.check.outputs.affects_workflow == 'true'
        run: |
          # Save this workflow before reverting it
          cp .github/workflows/commit-revert.yml /tmp/commit-revert.yml

          # Revert the latest two commits
          git revert HEAD --no-edit
          git revert HEAD --no-edit

          # Restore the workflow
          mkdir -p .github/workflows
          cp /tmp/commit-revert.yml .github/workflows/commit-revert.yml

          # Commit the restored workflow
          git add .github/workflows/commit-revert.yml
          git commit -m "Restore revert workflow"

          # Push all three commits
          git push origin HEAD:main
